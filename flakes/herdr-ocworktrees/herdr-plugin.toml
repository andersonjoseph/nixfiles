id = "anderson.ocworktrees"
name = "herdr-ocworktrees"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Mirror OpenCode-managed git worktrees into herdr workspaces"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "herdr-ocworktrees", "."]

[[startup]]
command = ["./herdr-ocworktrees", "sync"]

[[actions]]
id = "sync"
title = "Sync OpenCode worktrees"
command = ["./herdr-ocworktrees", "sync"]

[[events]]
on = "workspace.focused"
command = ["./herdr-ocworktrees", "sync"]

[[events]]
on = "tab.focused"
command = ["./herdr-ocworktrees", "sync"]

[[events]]
on = "pane.focused"
command = ["./herdr-ocworktrees", "sync"]

[[events]]
on = "pane.created"
command = ["./herdr-ocworktrees", "sync"]
